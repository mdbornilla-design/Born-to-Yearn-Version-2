<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#09060a">
<meta name="description" content="Shop gaming laptops, keyboards, mice, headsets, monitors and chairs at Born to Yearn.">
<title>Shop — Born to Yearn</title>
<link rel="icon" href="images/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body id="top" data-page="shop">
<div id="hdr"></div>
<main class="wrap">
  <div class="pagehead">
    <p class="crumbs"><a href="index.html">HOME</a> / SHOP</p>
    <p class="eyebrow">THE LOADOUT</p><h1>Find your next <em>favorite.</em></h1>
    <p class="sub">Prices are in Philippine pesos. Tap any item for full specs, or save it with the ♥.</p>
    <div class="shop-tools">
      <label class="search"><span>⌕</span><input id="productSearch" type="search" placeholder="Search gear, brands or specs…" aria-label="Search products"></label>
      <select id="sort" aria-label="Sort products"><option value="featured">Featured</option><option value="asc">Price: low to high</option><option value="desc">Price: high to low</option><option value="name">Name: A–Z</option></select>
    </div>
    <div class="chips" id="chips"></div>
    <div class="filters glass">
      <label class="range">Max price <input type="range" id="maxPrice" min="0" step="1000" aria-label="Maximum price"> <b id="maxLabel">Any price</b></label>
      <label class="check"><input type="checkbox" id="inStock"> In stock only</label>
    </div>
  </div>
  <p class="results" id="results"></p>
  <div class="grid" id="grid"></div>
  <p class="empty hidden" id="empty"></p>
  <p class="note" style="margin-bottom:70px">Prices and stock are sample values for this project; specs are typical for each model and vary by configuration — confirm before selling.</p>
</main>
<div id="ftr"></div>
<script src="catalog.js"></script>
<script src="script.js"></script>
</body>
</html>
